services:
  workspace:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - workspace-data:/data
    environment:
      APP_DATA_DIR: /data
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_EXTRACT: ${MODEL_EXTRACT:-}
      MODEL_REVIEW: ${MODEL_REVIEW:-}
      MODEL_CRITIC: ${MODEL_CRITIC:-}
    restart: "no"
volumes:
  workspace-data:

